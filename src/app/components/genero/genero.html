<div class="fundo-genero" [style.backgroundImage]="'url(' + fundoImagem + ')'">
  <div class="overlay">

    <!-- ========== MENSAGENS ========== -->
    <div class="container">
      <div *ngIf="mensagemSucesso" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
        <i class="fa fa-check-circle"></i> {{ mensagemSucesso }}
        <button type="button" class="btn-close" (click)="mensagemSucesso = ''"></button>
      </div>

      <div *ngIf="mensagemErro" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
        <i class="fa fa-lock"></i> {{ mensagemErro }}
        <button type="button" class="btn btn-sm btn-outline-danger ms-3" (click)="irParaLogin()">
          Fazer Login
        </button>
        <button type="button" class="btn-close" (click)="mensagemErro = ''"></button>
      </div>
    </div>

    <!-- Botão Voltar -->
    <div class="container">
      <button class="btn-voltar" (click)="voltar()">
        <i class="fa fa-arrow-left"></i> Voltar
      </button>
    </div>

    <!-- Título -->
    <div class="container text-center titulo-genero">
      <h1 class="display-3" [style.color]="getCorGenero()">
         {{ getNomeGenero() }}
      </h1>
    </div>

    <!-- Álbuns -->
    <div class="container pb-4">
      <div *ngIf="albuns.length === 0" class="text-center py-5">
        <h3 class="text-white"> Nenhum álbum encontrado neste gênero</h3>
      </div>

      <div class="row row-cols-3 row-cols-sm-4 row-cols-md-5 row-cols-lg-6 row-cols-xl-8 g-3">
        <div class="col" *ngFor="let album of albuns">
          <div class="card h-100 shadow-sm">
            <img
              [src]="album.imagem"
              [alt]="album.nome"
              class="card-img-top"
            >
            <div class="card-body">
              <h6 class="card-title" title="{{ album.nome }}">{{ album.nome }}</h6>
              <p class="card-text text-muted">{{ album.artista }}</p>
              <p class="card-text">
                <span class="badge" [style.background-color]="getCorGenero()">{{ album.genero }}</span>
                <span class="badge bg-info ms-1">{{ album.ano }}</span>
              </p>
              <h6 class="text-success mb-0">R$ {{ album.preco | number:'1.2-2' }}</h6>
            </div>
            <div class="card-footer d-flex justify-content-between">
              <button class="btn btn-outline-primary btn-sm" [routerLink]="['/detalhes', album.id]" title="Detalhes">
                <i class="fa fa-info-circle"></i>
              </button>
              <button class="btn btn-primary btn-sm" (click)="adicionarCesta(album)" title="Comprar">
                <i class="fa fa-shopping-cart"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
